databases:
  - name: taskivo-db
    plan: free
    databaseName: taskivo
    user: taskivo

services:
  - type: web
    name: taskivo-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_OTP
        value: "123456"
      - key: DATABASE_URL
        fromDatabase:
          name: taskivo-db
          property: connectionString
